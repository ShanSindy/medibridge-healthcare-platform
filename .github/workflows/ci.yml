name: MediBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: FastAPI and PostgreSQL Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medibridge
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: medibridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medibridge -d medibridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: medibridge_test
      DB_USER: medibridge
      DB_PASSWORD: ci_test_password
      SECRET_KEY: ci_only_test_secret_key_not_for_production
      JWT_SECRET_KEY: ci_only_test_secret_key_not_for_production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python migrate.py

      - name: Run automated tests
        run: python -m pytest -q --tb=short
