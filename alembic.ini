# Alembic configuration (Phase 2 Milestone 6 candidate). See
# docs/decisions/0003-alembic-baseline.md.
#
# There is deliberately no sqlalchemy.url: alembic/env.py builds the connection from the
# same DB_* settings as the application, so no credentials live in this file.
# Supported today, from the repository root with the DB_* settings in the environment:
#   alembic -x expected_database=<DB_NAME> upgrade head
# on a fresh, empty database only. Existing
# databases are never adopted or stamped by this configuration.

[alembic]
script_location = %(here)s/alembic
path_separator = os
prepend_sys_path = %(here)s
