# Tool configuration only. MediBridge is not packaged; dependencies are pinned
# in requirements.txt (runtime and tests) and requirements-dev.txt (quality tools).

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused/undefined names, redefinitions
    "I",    # import ordering
    "B",    # bugbear: likely bugs and design problems
    "UP",   # syntax for the target Python version
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PIE",  # misc. unnecessary code
    "RUF",  # Ruff-specific correctness checks
    "T20",  # stray print() calls
    "PT",   # pytest usage
    "S",    # security (bandit)
]
ignore = [
    # Nested `with get_connection() as conn:` / `with conn.cursor() as cur:`
    # blocks read more clearly than one combined `with` statement.
    "SIM117",
    # Tuple vs. comma-string parametrize names is style only.
    "PT006",
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; passwords in tests are synthetic fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Printing progress is the purpose of the migration command.
"migrate.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as default arguments, and
# require_permission()/require_roles() deliberately build the dependency once, at import.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Body",
    "auth_dependencies.require_permission",
    "auth_dependencies.require_roles",
]

[tool.pytest.ini_options]
# Collect tests only from tests/, never from scripts at the repository root.
testpaths = ["tests"]
# Load the isolation guard for every run, including --noconftest runs, from the
# repository root or from tests/ (pythonpath makes `tests.` importable in both).
pythonpath = ["."]
addopts = ["-p", "tests.isolation_guard"]

[tool.coverage.run]
branch = true
# Scan the whole repository so files that no test imports still count, as 0%.
source = ["."]
omit = [".venv/*", "frontend/*"]

[tool.coverage.report]
# The measured scope, listed explicitly. Only these files are reported and
# counted towards fail_under, so nothing else present in a working copy
# (local scripts, scratch files) can change the result.
# tests/test_coverage_scope.py fails if a tracked Python file is neither
# listed here nor one of the deliberate exclusions (test cases, scripts/).
include = [
    # Application modules
    "appointment_service.py",
    "audit.py",
    "audit_service.py",
    "auth_dependencies.py",
    "auth_service.py",
    "database.py",
    "db_engine.py",
    "db_errors.py",
    "fhir.py",
    "hl7_ack.py",
    "hl7_parser.py",
    "hl7_service.py",
    "hl7_tracking.py",
    "main.py",
    "models.py",
    "patients.py",
    "permissions.py",
    "provision_user.py",
    "provider_service.py",
    "security.py",
    "seed_demo_data.py",
    "token_service.py",
    "user_service.py",
    # API routers
    "routers/__init__.py",
    "routers/appointments.py",
    "routers/audit_logs.py",
    "routers/auth.py",
    "routers/fhir.py",
    "routers/hl7.py",
    "routers/patients.py",
    "routers/providers.py",
    "routers/system.py",
    # Migration logic
    "migrate.py",
    # Test-database safety infrastructure
    "conftest.py",
    "tests/conftest.py",
    "tests/db_safety.py",
    "tests/disposable_database.py",
    "tests/isolation_guard.py",
    "tests/pg_helpers.py",
]
# Combined line + branch coverage. Baseline measured before enforcement: 87.0%.
fail_under = 85
show_missing = true
precision = 1
